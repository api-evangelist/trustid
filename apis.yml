name: Trustid
description: TRUSTID was a Portland, Oregon telephone caller-authentication and call-center
  anti-fraud company led by CEO Patrick Cox, authenticating inbound callers pre-answer without
  knowledge-based interrogation of the caller. Surfaced as a portfolio company of Norwest Venture
  Partners and Trinity Ventures, TRUSTID was acquired by Neustar (closed January 2019), and Neustar
  was itself acquired by TransUnion in December 2021, where the caller-authentication capability
  lives on in Trusted Call Solutions. TRUSTID no longer operates independently and publishes no
  public API surface — trustid.com is unresponsive and www.trustid.com returns HTTP 503 from
  Neustar redirect infrastructure.
